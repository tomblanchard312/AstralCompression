[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astral-compression"
version = "1.0.0"
description = "Extreme compression and loss-tolerant messaging for deep-space RF links"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tom Blanchard", email = "tomblanchard312@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "compression", "fountain-code", "lt-code", "ccsds", "space", "telemetry",
    "reed-solomon", "deep-space", "erasure-coding",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Compression",
]

[tool.setuptools]
packages = { find = { exclude = ["astral_compress*", "tests*", "benchmarks*", "docs*"] } }

[project.optional-dependencies]
rs    = ["reedsolo>=1.7"]
voice = ["pycodec2>=4.0", "numpy>=1.24"]
fast = ["astral-compress>=0.1.0", "zstd>=1.5"]
all   = ["reedsolo>=1.7", "pycodec2>=4.0", "numpy>=1.24", "astral-compress>=0.1.0", "zstd>=1.5"]

[project.urls]
Homepage = "https://github.com/tomblanchard312/AstralCompression"
Repository = "https://github.com/tomblanchard312/AstralCompression"
Changelog = "https://github.com/tomblanchard312/AstralCompression/blob/main/CHANGELOG.md"
Specification = "https://github.com/tomblanchard312/AstralCompression/blob/main/docs/FORMAT.md"
Issues = "https://github.com/tomblanchard312/AstralCompression/issues"

[project.scripts]
astral = "astral.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
