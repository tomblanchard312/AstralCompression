[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gistlink"
version = "2.0.0"
description = "Loss-tolerant messaging for one-way links, where the gist arrives first"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Tom Blanchard", email = "tomblanchard312@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "compression", "fountain-code", "lt-code", "ccsds", "space", "telemetry",
    "reed-solomon", "deep-space", "erasure-coding", "lossy-links", "lora",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Compression",
]

[tool.setuptools]
packages = { find = { exclude = ["gistlink_native*", "tests*", "benchmarks*", "docs*", "examples*"] } }

[tool.setuptools.package-data]
gistlink = ["py.typed"]

[project.optional-dependencies]
rs    = ["reedsolo>=1.7"]
dict  = ["zstandard>=0.21"]
voice = ["pycodec2>=4.0", "numpy>=1.24"]
# The Rust extension is not on PyPI: this repository builds it under the name
# gistlink_native, and naming any distribution here made `pip install
# gistlink[fast]` fail outright. The extra installs the zstd binding it can
# actually get; build the extension with maturin (see the README) to add the
# native path.
fast = ["zstd>=1.5"]
all   = [
    "reedsolo>=1.7", "zstandard>=0.21", "pycodec2>=4.0", "numpy>=1.24",
    "zstd>=1.5",
]

[project.urls]
Homepage = "https://github.com/tomblanchard312/gistlink"
Repository = "https://github.com/tomblanchard312/gistlink"
Changelog = "https://github.com/tomblanchard312/gistlink/blob/main/CHANGELOG.md"
Specification = "https://github.com/tomblanchard312/gistlink/blob/main/docs/FORMAT.md"
Issues = "https://github.com/tomblanchard312/gistlink/issues"

[project.scripts]
gistlink = "gistlink.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
