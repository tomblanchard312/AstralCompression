name: Build and publish

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  # The package users actually install. This is pure Python, so one wheel
  # serves every platform. It was missing from this workflow entirely: only
  # the native extension was built, so a release published the accelerator
  # without the library, the CLI or anything importable as `gistlink`.
  build_package:
    name: Build the gistlink package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the built wheel installs and runs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "
          from gistlink import pack_compressed_message, unpack_compressed_stream
          data = b'satellite telemetry nominal ' * 50
          assert unpack_compressed_stream(pack_compressed_message(data, 'TEXT'))['data'] == data
          print('package roundtrips')
          "
          /tmp/check/bin/gistlink --help > /dev/null
          echo "console script works"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  build_native_wheels:
    name: Native extension on ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build wheels
        run: |
          cd gistlink_native
          maturin build --release --target ${{ matrix.target }} --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: gistlink_native/dist/*.whl

  build_native_sdist:
    name: Native source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build source distribution
        run: |
          cd gistlink_native
          maturin build --sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-sdist
          path: gistlink_native/dist/*.tar.gz

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build_package, build_native_wheels, build_native_sdist]
    if: github.event_name == 'release'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Gather every distribution
        run: |
          mkdir -p dist
          find collected -name '*.whl' -o -name '*.tar.gz' | xargs -I{} cp {} dist/
          ls -la dist/
          # Publishing the accelerator without the package would leave
          # `pip install gistlink` broken, so refuse to publish a set that
          # does not contain the package itself.
          ls dist/gistlink-*.whl >/dev/null
          ls dist/gistlink-*.tar.gz >/dev/null

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
