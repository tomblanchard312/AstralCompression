name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 reedsolo maturin zstd zstandard numpy

      - name: Build and install Rust extension
        run: |
          cd gistlink_native
          maturin build --release --out ../dist
          pip install ../dist/*.whl

      - name: Lint with flake8
        run: flake8 gistlink/ tests/ benchmarks/ --config=setup.cfg

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

      - name: Verify the Rust extension actually works
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import struct
          import gistlink_native as ac
          from gistlink import compress as engine
          assert hasattr(ac, 'compress_text'), 'extension built but not importable'
          assert engine._RUST_AVAILABLE, 'Rust fast path not selected'

          # Importable is not the same as working. Exercise every entry point:
          # a silently broken accelerator that falls back to Python passes
          # every other test in this suite, and reading 'falling back' in a
          # log is not enough to tell a fault from a designed fallback.
          text = b'satellite telemetry nominal battery ' * 40
          assert ac.decompress_text(ac.compress_text(text)) == text

          raw = struct.pack('>400f', *[i * 0.25 for i in range(400)])
          assert ac.decompress_binary_float(ac.compress_binary_float(raw), len(raw)) == raw

          out = ac.decompress_telemetry(ac.compress_telemetry(raw, 4), len(raw), 4)
          assert len(out) == len(raw)
          print('Rust extension active and round-tripping')
          "

      - name: Run the worked examples
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python examples/usage.py
