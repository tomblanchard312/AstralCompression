name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 reedsolo maturin zstd zstandard numpy

      - name: Build and install Rust extension
        run: |
          cd astral_compress
          maturin build --release --out ../dist
          pip install ../dist/*.whl

      - name: Lint with flake8
        run: flake8 astral/ tests/ benchmarks/ --config=setup.cfg

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

      - name: Verify the Rust extension is actually exercised
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import astral_compress as ac
          from astral import mckay_astral_integration as mk
          assert hasattr(ac, 'compress_text'), 'extension built but not importable'
          assert mk._RUST_AVAILABLE, 'Rust fast path not selected'
          print('Rust extension active')
          "

      - name: Run the worked examples
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python examples/usage.py
